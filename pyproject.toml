[project]
name = "plsdo"
dynamic = ["version"]
description = "PLS covariance analysis with statistical testing and visualisation"
readme = "README.md"
keywords = ["PLS", "multivariate", "statistics", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
license = "BSD-3-Clause"
authors = [
    { name = "Eilidh MacNicol" },
]
maintainers = [
    { name = "Eilidh MacNicol" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cv = [
    "scikit-learn>=1.2",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.15.11",
    "pre-commit",
    "scikit-learn",
]

[project.scripts]
plsdo = "plsdo.cli:pls_main"

[project.urls]
Repository = "https://github.com/braincentrekcl/plsdo"
Issues = "https://github.com/braincentrekcl/plsdo/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "plsdo/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::UserWarning:seaborn",
    # seaborn 0.13.2 (the latest release, Jan 2024) calls matplotlib's bxp()
    # with vert=, which matplotlib >= 3.10 deprecates in favour of orientation=.
    # The fix is merged on seaborn's main branch (PR #3820) but unreleased, and
    # seaborn has not cut a release in over two years — so there is no version
    # to bump to and no firm timeline. Ignore this third-party warning; remove
    # this line if/when seaborn next releases.
    "ignore:vert.*deprecated:PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["plsdo"]

[tool.coverage.report]
show_missing = true
fail_under = 95
